name: Secure Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries
        run: |
          mkdir -p release-binaries
          GOOS=linux GOARCH=amd64 go build -o release-binaries/git-scope-linux-amd64 ./cmd/git-scope
          GOOS=darwin GOARCH=amd64 go build -o release-binaries/git-scope-darwin-amd64 ./cmd/git-scope
          GOOS=windows GOARCH=amd64 go build -o release-binaries/git-scope-windows-amd64.exe ./cmd/git-scope

      - name: Generate Checksums
        run: |
          cd release-binaries
          sha256sum * > checksums.txt
          mv checksums.txt ../checksums.txt

      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-binaries/*'

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-binaries/*
            checksums.txt
          draft: false
          prerelease: false
