name: Secure Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6eeffbb4d1ef621d166 # v5.0.0
        with:
          go-version: '1.22'

      - name: Build binaries
        run: |
          mkdir -p release-binaries
          GOOS=linux GOARCH=amd64 go build -o release-binaries/git-scope-linux-amd64 ./cmd/git-scope
          GOOS=darwin GOARCH=amd64 go build -o release-binaries/git-scope-darwin-amd64 ./cmd/git-scope
          GOOS=windows GOARCH=amd64 go build -o release-binaries/git-scope-windows-amd64.exe ./cmd/git-scope

      - name: Generate Checksums
        run: |
          cd release-binaries
          sha256sum * > checksums.txt
          mv checksums.txt ../checksums.txt

      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-binaries/*'

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365fac7b0e539b4 # v2.1.0
        with:
          files: |
            release-binaries/*
            checksums.txt
          draft: false
          prerelease: false
