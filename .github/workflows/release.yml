name: Release Go Binary

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a version tag like v1.0.0

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            binary: git-scope-linux-amd64
          - os: linux
            arch: arm64
            binary: git-scope-linux-arm64
          - os: darwin
            arch: amd64
            binary: git-scope-darwin-amd64
          - os: darwin
            arch: arm64
            binary: git-scope-darwin-arm64
          - os: windows
            arch: amd64
            binary: git-scope-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -o ${{ matrix.binary }} ./cmd/git-scope

      - name: Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.binary }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
