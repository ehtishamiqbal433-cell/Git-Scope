name: CI & Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov click

      - name: Run test suite with coverage
        run: |
          pytest --cov=cli --cov-report=term-missing tests/

      - name: Run local AST security scan
        run: |
          python3 cli/main.py scan
